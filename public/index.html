<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrafiLights – Ampel-optimierte Rollerroute</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <!--
    Real map tiles (MapLibre GL JS + OpenStreetMap raster tiles) are loaded from a CDN.
    If the CDN or the tile servers are unreachable (offline, restrictive network policy, …),
    app.js detects this and falls back to the built-in Canvas map further down, so the app
    keeps working either way.
  -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" onerror="window.__maplibreLoadFailed = true"></script>
</head>
<body>
  <header class="app-header">
    <h1>🛵 TrafiLights</h1>
    <p class="tagline">Die Route mit den wenigsten Ampeln in Fahrtrichtung – für Roller &amp; Motorrad.</p>
  </header>

  <main class="layout">
    <section class="panel">
      <form id="route-form">
        <div class="field-group">
          <label class="autocomplete">
            Start-Adresse
            <input type="text" id="from-address" autocomplete="off" placeholder="z. B. Musterstraße 1, Musterstadt" />
            <ul class="suggestions" id="from-suggestions"></ul>
          </label>
          <label class="autocomplete">
            Ziel-Adresse
            <input type="text" id="to-address" autocomplete="off" placeholder="z. B. Arbeitsplatz, Musterstadt" />
            <ul class="suggestions" id="to-suggestions"></ul>
          </label>
        </div>

        <button type="submit" id="calc-btn">Route berechnen</button>
      </form>

      <p class="status" id="status" role="status"></p>

      <div class="favorites">
        <div class="favorites-header">
          <h2>Favoriten</h2>
          <button type="button" id="save-favorite-btn" disabled>+ Aktuelle Route speichern</button>
        </div>
        <ul id="favorites-list" class="favorites-list"></ul>
      </div>

      <div id="results" class="results hidden">
        <h2>Routenoptionen</h2>
        <div id="route-cards" class="route-cards"></div>
      </div>
    </section>

    <section class="map-section">
      <div id="map-libre"></div>
      <canvas id="map-canvas"></canvas>
      <div class="legend" id="legend"></div>
      <p class="map-fallback-note hidden" id="map-fallback-note">
        Echte Kartenkacheln (OpenStreetMap) nicht erreichbar – zeige schematische Karte.
      </p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
