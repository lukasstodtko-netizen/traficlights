<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SmoothRide, fewest-lights routing for scooters</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!--
    iOS home-screen app mode: if added to the home screen, this drops Safari's
    address/tab bar entirely for a true edge-to-edge, app-like screen - the natural
    extension of the on-page zoom lock (see styles.css) for iPhones with a Dynamic
    Island or notch. black-translucent lets our own safe-area-inset padding (already
    used throughout styles.css) draw under the status bar instead of leaving a gap.
  -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SmoothRide" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <!--
    Real map tiles (MapLibre GL JS + OpenStreetMap raster tiles) are loaded from a CDN.
    If the CDN or the tile servers are unreachable (offline, restrictive network policy, …),
    app.js detects this and falls back to the built-in Canvas map further down, so the app
    keeps working either way.
  -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" onerror="window.__maplibreLoadFailed = true"></script>
</head>
<body>
  <!-- Full-bleed map, the app's backdrop - everything else floats on top of it. -->
  <div class="map-section">
    <div id="map-libre"></div>
    <canvas id="map-canvas"></canvas>
    <div class="legend" id="legend"></div>
    <p class="map-fallback-note hidden" id="map-fallback-note">
      Real map tiles (OpenStreetMap) unavailable, showing schematic map.
    </p>
  </div>

  <!-- Turn-by-turn banner: only visible while navigating, floats at the top of the screen. -->
  <div class="nav-banner hidden" id="nav-panel">
    <div class="nav-banner-main">
      <div class="nav-banner-icon" id="nav-icon" data-turn="straight">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3l7 8h-4.5v10h-5V11H5l7-8z" fill="currentColor" />
        </svg>
      </div>
      <div class="nav-banner-text">
        <div class="nav-distance" id="nav-distance-to-maneuver">–</div>
        <div class="nav-instruction" id="nav-instruction">Preparing route …</div>
      </div>
    </div>
    <p class="nav-status" id="nav-status" role="status"></p>
  </div>

  <!-- Bottom stats bar: only visible while navigating. -->
  <div class="nav-bottom-bar hidden" id="nav-bottom-bar">
    <div class="nav-bottom-stat">
      <span class="nav-bottom-value" id="nav-time-remaining">–</span>
      <span class="nav-bottom-label">Time</span>
    </div>
    <div class="nav-bottom-stat">
      <span class="nav-bottom-value" id="nav-distance-remaining">–</span>
      <span class="nav-bottom-label">Distance</span>
    </div>
    <button type="button" id="stop-nav-btn" class="stop-nav-btn" aria-label="End navigation">✕</button>
  </div>

  <!-- Floating glass panel: search + favorites + route options. A card on desktop, a bottom sheet on phones. -->
  <div class="floating-panel" id="planning-section">
    <div class="panel-handle"></div>

    <header class="app-header">
      <div>
        <h1>SmoothRide</h1>
        <p class="tagline">The route with the fewest lights ahead of you</p>
      </div>
    </header>

    <form id="route-form">
      <div class="field-group">
        <label class="autocomplete search-field">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
            <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <input type="text" id="from-address" autocomplete="off" placeholder="Starting point" />
          <ul class="suggestions" id="from-suggestions"></ul>
        </label>
        <label class="autocomplete search-field">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path
              d="M12 21s7-6.2 7-11.5A7 7 0 105 9.5C5 14.8 12 21 12 21z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
            <circle cx="12" cy="9.5" r="2.3" stroke="currentColor" stroke-width="2" />
          </svg>
          <input type="text" id="to-address" autocomplete="off" placeholder="Destination" />
          <ul class="suggestions" id="to-suggestions"></ul>
        </label>
      </div>

      <button type="submit" id="calc-btn">Get route</button>
    </form>

    <p class="status" id="status" role="status"></p>

    <div class="favorites">
      <div class="favorites-header">
        <h2>Favorites</h2>
        <button type="button" id="save-favorite-btn" disabled>+ Save</button>
      </div>
      <ul id="favorites-list" class="favorites-list"></ul>
    </div>

    <div id="results" class="results hidden">
      <h2>Route options</h2>
      <div id="route-cards" class="route-cards"></div>
      <button type="button" id="start-nav-btn">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M8 5v14l11-7L8 5z" fill="currentColor" />
        </svg>
        Go
      </button>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
